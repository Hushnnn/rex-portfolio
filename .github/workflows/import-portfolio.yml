          """.strip().splitlines())

          def blob(data):
              return sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def copy(item):
              filename, expected = item
              target = Path('docs/assets') / filename
              if target.exists():
                  if blob(target.read_bytes()) != expected:
                      raise ValueError(f'Existing file differs: {filename}')
                  return
              for attempt in range(3):
                  try:
                      with urlopen(Request(source + filename, headers={'User-Agent': 'Rex-Portfolio-Publication'}), timeout=60) as response:
                          data = response.read()
                      if blob(data) != expected:
                          raise ValueError(f'Original differs: {filename}')
                      target.write_bytes(data)
                      print(f'Verified {filename}', flush=True)
                      return
                  except Exception:
                      if attempt == 2:
                          raise
                      sleep(2 * (attempt + 1))

          with ThreadPoolExecutor(max_workers=6) as workers:
              list(workers.map(copy, manifest.items()))

      - name: Publish verified media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/assets
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified project media and documents"
            git push origin HEAD:main
          fi

