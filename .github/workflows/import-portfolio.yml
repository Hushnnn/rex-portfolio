name: Import verified portfolio media
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-portfolio.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Copy original portfolio media and verify Git blob hashes
